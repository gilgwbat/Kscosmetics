<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c2185b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KS Catálogo" />
  <link id="pwa-manifest" rel="manifest" />
  <script>
    (function () {
      const iconSvg = encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
          '<rect width="192" height="192" rx="36" fill="#c2185b"/>' +
          '<text x="96" y="118" font-family="Arial,sans-serif" font-size="76" font-weight="bold" fill="#ffffff" text-anchor="middle">KS</text>' +
        '</svg>'
      );
      const manifest = {
        name: "KS Cosmetics Mayoreo",
        short_name: "KS Catálogo",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#fdf6f9",
        theme_color: "#c2185b",
        icons: [
          {
            src: "data:image/svg+xml," + iconSvg,
            sizes: "192x192",
            type: "image/svg+xml",
            purpose: "any"
          }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("pwa-manifest").href = URL.createObjectURL(blob);
    })();
  </script>
  <title>KS Cosmetics Mayoreo — Demo App</title>
  <style>
    :root {
      --bg: #fdf6f9;
      --card: #ffffff;
      --ink: #23121c;
      --muted: #6f5564;
      --primary: #c2185b;
      --primary-dark: #880e4f;
      --accent: #f48fb1;
      --soft: #fce4ec;
      --ok: #1b5e20;
      --ok-bg: #e8f5e9;
      --warn: #8d4e00;
      --warn-bg: #fff8e1;
      --gold: #6d4c00;
      --gold-bg: #fff3cd;
      --border: #f0d6e0;
      --shadow: 0 8px 24px rgba(136, 14, 79, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 88px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #ec407a);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
    }

    .brand-title { font-weight: 800; font-size: 16px; }
    .brand-sub { font-size: 12px; color: var(--muted); }

    .badge-sync {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--ok-bg);
      color: var(--ok);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .badge-wholesale-user {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid #f5d67b;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      margin-left: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      padding: 9px 14px;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--border);
      font-weight: 600;
      padding: 8px 12px;
    }

    .btn-soft {
      background: var(--soft);
      color: var(--primary-dark);
      font-weight: 700;
      padding: 8px 12px;
    }

    .btn-gold {
      background: var(--gold-bg);
      color: var(--gold);
      border: 1px solid #f5d67b;
      font-weight: 800;
      padding: 9px 12px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
    }

    .banner-carousel {
      position: relative;
      background: linear-gradient(120deg, var(--primary-dark), var(--primary));
      color: #fff;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      min-height: 150px;
    }

    .banner-slide-bg {
      position: relative;
      padding: 20px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-size: cover;
      background-position: center;
    }

    .banner-slide-bg.has-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(35, 10, 24, 0.82) 0%, rgba(35, 10, 24, 0.45) 100%);
    }

    .banner-content {
      position: relative;
      z-index: 2;
      max-width: 720px;
    }

    .banner-content h1 { font-size: 20px; margin-bottom: 4px; }
    .banner-content p { font-size: 13px; opacity: 0.96; }

    .banner-controls {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .banner-dot-btn {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      padding: 0;
    }

    .banner-dot-btn.active {
      background: #fff;
      transform: scale(1.2);
    }

    .banner-arrow {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
    }

    .wholesale-pill-banner {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .search-input, .brand-select {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font: inherit;
    }

    .search-input {
      flex: 1 1 210px;
    }

    .brand-select {
      min-width: 175px;
      font-weight: 600;
      color: var(--ink);
    }

    .cats {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 7px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .thumb {
      position: relative;
      height: 140px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 46px;
      cursor: pointer;
      background: linear-gradient(135deg, #fce4ec, #fff0f5);
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      display: grid;
      place-items: center;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .video-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(35, 18, 28, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .prod-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
    }

    .prod-cat { font-size: 11px; text-transform: uppercase; color: var(--primary); font-weight: 700; }
    .prod-brand {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .prod-title { font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 4px; }

    .shades {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .shade-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }

    .shade-dot.selected {
      box-shadow: 0 0 0 2px var(--primary);
      transform: scale(1.1);
    }

    .shade-label { font-size: 12px; color: var(--muted); }

    .prices {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .price-main { font-size: 17px; font-weight: 800; color: var(--primary-dark); }
    .price-sub { font-size: 12px; color: var(--muted); }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .card-actions .btn-primary { flex: 1; padding: 9px 10px; font-size: 13px; }
    .card-actions .btn-soft { padding: 9px 10px; font-size: 12px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
      z-index: 25;
    }

    .nav-item {
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
    }

    .nav-item.active { color: var(--primary); }

    .cart-count {
      background: var(--primary);
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: 4px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 9, 18, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 40;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 18px;
      width: 100%;
      max-width: 600px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.22);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .close-btn {
      background: var(--soft);
      color: var(--ink);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-weight: 800;
    }

    .admin-section {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .admin-section h4 {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--primary-dark);
    }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font: inherit;
      background: #fff;
    }

    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #edd6e0;
      font-size: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f7e6ed;
      font-size: 13px;
    }

    .qty-box { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--soft);
      color: var(--primary-dark);
      font-weight: 800;
    }

    .order-sheet {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 4px 14px rgba(136, 14, 79, 0.05);
    }

    .order-sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .order-folio {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    .order-units-pill {
      display: inline-block;
      margin-top: 4px;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .order-status-pill {
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .order-line-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f5e3eb;
    }

    .order-line-row:last-child {
      border-bottom: none;
    }

    .order-line-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .order-line-thumb {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #fce4ec, #fff0f5);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .order-line-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .order-line-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .order-line-math {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    .order-line-amount {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      text-align: right;
      white-space: nowrap;
    }

    .order-sheet-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      margin-top: 4px;
      border-top: 1px dashed var(--border);
      font-size: 15px;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .summary-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      font-size: 13px;
    }

    .status-banner {
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-retail {
      background: var(--soft);
      color: var(--primary-dark);
    }

    .status-pending-total {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .status-wholesale-ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-dark);
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .swatch-preview {
      height: 84px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
      margin: 10px 0;
      transition: transform 0.35s ease, filter 0.35s ease;
    }

    .swatch-preview.animating {
      transform: scale(1.03) skewX(-4deg);
      filter: brightness(1.08);
    }

    .video-box {
      background: #180b12;
      color: #fff;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0
